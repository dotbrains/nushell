name: Tests

on: [push, pull_request]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set TERM variable
        run: echo "TERM=xterm-256color" >> $GITHUB_ENV

      - name: Install Nushell (macOS)
        if: runner.os == 'macOS'
        run: brew install nushell

      - name: Install Nushell (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          cargo install nu --version 0.99.0 --locked

      - name: Display Nushell version
        run: nu --version

      - name: Test env.nu sourcing
        run: |
          # Create minimal test environment
          mkdir -p ~/.config/nushell/test
          cp env.nu ~/.config/nushell/test/
          cd ~/.config/nushell/test
          HOME_BACKUP=$HOME
          export HOME=$(pwd | sed 's|test$||')
          nu -n -c "source env.nu" 2>&1 | grep -v "deprecated" || echo "env.nu sourced successfully"
          export HOME=$HOME_BACKUP

      - name: Test config.nu sourcing
        run: |
          # Create minimal test environment with dependencies
          mkdir -p ~/.config/nushell/test/{aliases,colorscheme,variables,keybindings,functions}
          cp config.nu ~/.config/nushell/test/
          
          # Create stub files to satisfy dependencies
          echo "# stub" > ~/.config/nushell/test/colorscheme/colorscheme.nu
          echo "export def get_theme [] { {} }" >> ~/.config/nushell/test/colorscheme/colorscheme.nu
          
          cd ~/.config/nushell/test
          HOME_BACKUP=$HOME
          export HOME=$(pwd | sed 's|test$||')
          nu -n -c "source config.nu" 2>&1 | grep -v "deprecated" || echo "config.nu sourced successfully"
          export HOME=$HOME_BACKUP

      - name: Test aliases module
        run: |
          if [ -f "aliases/aliases.nu" ]; then
            # Create test environment for aliases
            mkdir -p ~/.config/nushell/test/aliases
            cp aliases/*.nu ~/.config/nushell/test/aliases/
            cd ~/.config/nushell/test
            HOME_BACKUP=$HOME
            export HOME=$(pwd | sed 's|test$||')
            nu -n -c "source aliases/aliases.nu" 2>&1 | grep -v "deprecated" || echo "aliases sourced successfully"
            export HOME=$HOME_BACKUP
          fi

      - name: Test functions module
        run: |
          if [ -f "functions/functions.nu" ]; then
            nu -n -c "source functions/functions.nu" 2>&1 | grep -v "deprecated" || echo "functions sourced successfully"
          fi

      - name: Test colorscheme module
        run: |
          if [ -f "colorscheme/colorscheme.nu" ]; then
            nu -n -c "source colorscheme/colorscheme.nu" 2>&1 | grep -v "deprecated" || echo "colorscheme sourced successfully"
          fi

      - name: Test variables module
        run: |
          if [ -f "variables/variables.nu" ]; then
            nu -n -c "source variables/variables.nu" 2>&1 | grep -v "deprecated" || echo "variables sourced successfully"
          fi

      - name: Test keybindings module
        run: |
          if [ -f "keybindings/keybindings.nu" ]; then
            nu -n -c "source keybindings/keybindings.nu" 2>&1 | grep -v "deprecated" || echo "keybindings sourced successfully"
          fi

      - name: Validate all .nu files syntax
        run: |
          # Use parse-only mode for syntax validation without execution
          find . -name "*.nu" -type f -not -path "*/.*" | while read -r file; do
            echo "Validating syntax of $file"
            # Try to parse the file without executing it
            if nu -n -c "open '$file' | null" 2>&1 | grep -E "(Error|error|Failed|failed)" | grep -v "deprecated"; then
              echo "✗ Syntax error in: $file"
              exit 1
            else
              echo "✓ Valid syntax: $file"
            fi
          done

      - name: Test custom commands
        run: |
          # Test that any custom commands can be loaded
          for file in $(find . -name "*.nu" -type f -not -path "*/.*"); do
            if grep -q "def " "$file"; then
              echo "Found custom commands in $file"
            fi
          done
