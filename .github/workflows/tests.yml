name: Tests

on: [push, pull_request]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set TERM variable
        run: echo "TERM=xterm-256color" >> $GITHUB_ENV

      - name: Install Nushell (macOS)
        if: runner.os == 'macOS'
        run: brew install nushell

      - name: Install Nushell (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          cargo install nu --version 0.99.0 --locked

      - name: Display Nushell version
        run: nu --version

      - name: Test env.nu syntax
        run: |
          # Test that env.nu has valid syntax
          nu --commands "nu-check env.nu"

      - name: Test config.nu syntax
        run: |
          # Test that config.nu has valid syntax
          nu --commands "nu-check config.nu"

      - name: Test aliases module syntax
        run: |
          if [ -f "aliases/aliases.nu" ]; then
            nu --commands "nu-check aliases/aliases.nu"
          fi

      - name: Test functions module syntax
        run: |
          if [ -f "functions/functions.nu" ]; then
            nu --commands "nu-check functions/functions.nu"
          fi

      - name: Test colorscheme module syntax
        run: |
          if [ -f "colorscheme/colorscheme.nu" ]; then
            nu --commands "nu-check colorscheme/colorscheme.nu"
          fi

      - name: Test variables module syntax
        run: |
          if [ -f "variables/variables.nu" ]; then
            nu --commands "nu-check variables/variables.nu"
          fi

      - name: Test keybindings module syntax
        run: |
          if [ -f "keybindings/keybindings.nu" ]; then
            nu --commands "nu-check keybindings/keybindings.nu"
          fi

      - name: Validate all .nu files syntax
        run: |
          find . -name "*.nu" -type f -not -path "*/.*" | while read -r file; do
            echo "Validating $file"
            nu --commands "nu-check $file" || exit 1
          done
