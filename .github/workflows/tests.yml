name: Tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set TERM variable
        run: echo "TERM=xterm-256color" >> $GITHUB_ENV

      - name: Install Nushell (macOS)
        if: runner.os == 'macOS'
        run: brew install nushell

      - name: Install Nushell (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install Linuxbrew
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          
          # Add Linuxbrew to PATH
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          
          # Install Nushell via brew
          brew install nushell

      - name: Display Nushell version
        run: nu --version

      - name: Setup test environment
        run: |
          # Copy all config files to expected location
          mkdir -p ~/.config/nushell
          cp -r . ~/.config/nushell/
          
      - name: Test env.nu sourcing
        run: |
          cd ~/.config/nushell
          nu -n -c "source env.nu" 2>&1 || echo "env.nu test complete"

      - name: Test config.nu sourcing
        run: |
          cd ~/.config/nushell
          nu -n -c "source config.nu" 2>&1 || echo "config.nu test complete"

      - name: Test aliases module
        run: |
          cd ~/.config/nushell
          if [ -f "aliases/aliases.nu" ]; then
            nu -n -c "source aliases/aliases.nu" 2>&1 || echo "aliases test complete"
          fi

      - name: Test functions module
        run: |
          cd ~/.config/nushell
          if [ -f "functions/functions.nu" ]; then
            nu -n -c "source functions/functions.nu" 2>&1 || echo "functions test complete"
          fi

      - name: Test colorscheme module
        run: |
          cd ~/.config/nushell
          if [ -f "colorscheme/colorscheme.nu" ]; then
            nu -n -c "source colorscheme/colorscheme.nu" 2>&1 || echo "colorscheme test complete"
          fi

      - name: Test variables module
        run: |
          cd ~/.config/nushell
          if [ -f "variables/variables.nu" ]; then
            nu -n -c "source variables/variables.nu" 2>&1 || echo "variables test complete"
          fi

      - name: Test keybindings module
        run: |
          cd ~/.config/nushell
          if [ -f "keybindings/keybindings.nu" ]; then
            nu -n -c "source keybindings/keybindings.nu" 2>&1 || echo "keybindings test complete"
          fi

      - name: Validate all .nu files syntax
        run: |
          # Use parse-only mode for syntax validation without execution
          find . -name "*.nu" -type f -not -path "*/.*" | while read -r file; do
            echo "Validating syntax of $file"
            # Try to parse the file without executing it
            if nu -n -c "open '$file' | null" 2>&1 | grep -E "(Error|error|Failed|failed)" | grep -v "deprecated"; then
              echo "✗ Syntax error in: $file"
              exit 1
            else
              echo "✓ Valid syntax: $file"
            fi
          done

      - name: Test custom commands
        run: |
          # Test that any custom commands can be loaded
          for file in $(find . -name "*.nu" -type f -not -path "*/.*"); do
            if grep -q "def " "$file"; then
              echo "Found custom commands in $file"
            fi
          done
