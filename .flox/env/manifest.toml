version = 1

# Reproducible toolchain for developing the Nushell configuration.
#
# Activate with `flox activate` from the nushell/ directory to get nushell
# and nodejs for syntax checks and markdownlint.

[install]
nushell.pkg-path = "nushell"
nodejs.pkg-path = "nodejs_20"

[options]
systems = [
  "aarch64-darwin",
  "x86_64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
